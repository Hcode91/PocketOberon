name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 28.2.13676358
  BUILD_DIR: build-android-arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # SDL3's unused sample project ships a wrapper JAR the validator doesn't recognise.
          validate-wrappers: false

      - name: Install CMake 3.31 and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '~3.31.0'
          ninjaVersion: latest

      - name: Install glslang
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 2G

      - name: Configure core
        run: |
          cmake -S core -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-31 -DCMAKE_BUILD_TYPE=Release \
            -DKYTY_BUILD_LAUNCHER=OFF -DBUILD_TESTING=OFF -DENABLE_CCACHE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build core
        run: ninja -C "$BUILD_DIR" capyps5

      - name: Copy native libraries
        run: |
          set -euo pipefail
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"
          STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          for lib in libcapyps5.so libmain_hook.so libfile_redirect_hook.so libgsl_alloc_hook.so libhook_impl.so; do
            path=$(find "$BUILD_DIR" -name "$lib" -type f | head -n 1)
            if [ -z "$path" ]; then echo "::error::$lib was not built"; exit 1; fi
            cp "$path" "$JNI/"
            "$STRIP" --strip-debug "$JNI/$lib"
          done
          cp "$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNI/"
          ls -l "$JNI"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketOberon-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
